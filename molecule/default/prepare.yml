---
- name: Prepare
  hosts: all
  become: true
  vars:
    zsh_user: "ubuntu"
  tasks:
    - name: Wait for automatic system updates
      shell: while fuser /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 1; done;
      changed_when: false

    - name: Ensure apt cache are updated
      apt:
        update_cache: true
        update_cache_retries: 5
        update_cache_retry_max_delay: 5
      register: _progress_status
      until: _progress_status is succeeded
      delay: 5
      retries: 5
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure unnecessary dependencies are removed
      package:
        name: curl-minimal
        state: absent
      register: _progress_status
      until: _progress_status is succeeded
      delay: 5
      retries: 5

    - name: Get user home directory
      getent:
        database: passwd
        key: "{{ zsh_user }}"

    - name: Ensure user "{{ zsh_user }}" exists
      user:
        name: "{{ zsh_user }}"
        password: "!" # disable password login, for sudo command root password will be used
        create_home: true
        shell: "/bin/bash"
        update_password: "on_create"
        state: present
      no_log: true

    # cached so the fact survives into the separate verify.yml run
    - name: Set user home directory fact
      set_fact:
        zsh_user_home: "{{ ansible_facts['getent_passwd'][zsh_user][4] }}"
        zsh_user: "{{ zsh_user }}"
        cacheable: true
