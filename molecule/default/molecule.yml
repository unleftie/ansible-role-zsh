---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
  ansible-lint .
platforms:
  - name: molecule-instance
    image: geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-/sbin/init}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      display_skipped_hosts: false
  lint:
    name: ansible-lint
  env:
    ANSIBLE_ROLES_PATH: "../../:../../../:${ANSIBLE_ROLES_PATH}"
    ANSIBLE_CACHE_PLUGIN: jsonfile
    ANSIBLE_CACHE_PLUGIN_CONNECTION: "${MOLECULE_EPHEMERAL_DIRECTORY}/facts_cache"
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - converge
    - verify
    - destroy
verifier:
  name: ansible
